<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DAILY/FIT" />
    <meta name="application-name" content="DAILY/FIT" />
    <meta name="theme-color" content="#FFFFF0" />
    <meta name="description" content="Show up daily. Progress, not perfection. A private daily log of your body, food, work and habits synced to your Google Sheet" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>DAILY/FIT – Progress, not perfection.</title>
  </head>
  <body class="bg-[#FFFFF0] text-[#16232B] antialiased selection:bg-[#FF5B04] selection:text-white overscroll-none min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Barlow', -apple-system, sans-serif; background-color: #FFFFF0; color: #16232B;">
        <div style="width: 44px; height: 44px; border: 3px solid #EAE5D9; border-top-color: #FF5B04; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <div style="margin-top: 16px; font-weight: 800; font-size: 18px; letter-spacing: 1px; font-family: 'Bebas Neue', sans-serif; color: #16232B;">DAILY / FIT</div>
        <div style="margin-top: 4px; font-size: 12px; color: #526673; letter-spacing: 0.3px; font-family: 'Barlow', sans-serif;">Show up daily. Progress, not perfection.</div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
