<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DAILY/FIT" />
    <meta name="application-name" content="DAILY/FIT" />
    <meta name="theme-color" content="#1F4E5F" />
    <meta name="description" content="A private, no-excuses daily log of your body, food, work and habits synced to your Google Sheet" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>DAILY/FIT – Specimen Tracker</title>
  </head>
  <body class="bg-[#F3EFEA] text-[#141414] antialiased selection:bg-[#0B369A] selection:text-white overscroll-none min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, sans-serif; background-color: #F3EFEA; color: #0B369A;">
        <div style="width: 48px; height: 48px; border: 3px solid #D9D1CA; border-top-color: #C34811; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <div style="margin-top: 16px; font-weight: 800; font-size: 14px; letter-spacing: 1px;">DAILY / FIT</div>
        <div style="margin-top: 4px; font-size: 11px; color: #6E6A64; letter-spacing: 0.5px;">SPECIMEN ARCHIVE</div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
