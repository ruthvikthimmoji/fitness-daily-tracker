<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DAILY/FIT" />
    <meta name="application-name" content="DAILY/FIT" />
    <meta name="theme-color" content="#FFFFF0" />
    <meta name="description" content="Show up daily. Progress, not perfection. A private daily log of your body, food, work and habits synced to your Google Sheet" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <title>DAILY/FIT – Progress, not perfection.</title>
  </head>
  <body class="bg-[#FFFFF0] text-[#16232B] antialiased selection:bg-[#FF5B04] selection:text-white overscroll-none min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Barlow', -apple-system, sans-serif; background-color: #FFFFF0; color: #16232B; position: relative; overflow: hidden;">
        <!-- Background Radial Halo -->
        <div style="position: absolute; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(255,91,4,0.12) 0%, rgba(255,255,240,0) 70%); pointer-events: none;"></div>

        <!-- Logo Emblem -->
        <div style="position: relative; width: 80px; height: 80px; border-radius: 24px; background: #16232B; padding: 14px; box-shadow: 0 16px 36px rgba(22,35,43,0.18); display: flex; align-items: center; justify-content: center; animation: logoFloat 2s ease-in-out infinite alternate;">
          <img src="/logo-white.png" alt="DAILY/FIT" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>

        <!-- Title -->
        <div style="margin-top: 20px; font-weight: 800; font-size: 26px; letter-spacing: 2px; font-family: 'Bebas Neue', -apple-system, sans-serif; color: #16232B; display: flex; align-items: baseline; gap: 6px;">
          <span>DAILY</span>
          <span style="color: #FF5B04;">/ FIT</span>
        </div>

        <!-- Tagline Pill -->
        <div style="margin-top: 8px; padding: 4px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E8E3D5; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #56646E; font-family: 'Barlow Condensed', sans-serif;">
          Progress, Not Perfection
        </div>

        <!-- Progress Loading Bar -->
        <div style="margin-top: 28px; width: 140px; height: 3px; border-radius: 999px; background: #E8E3D5; overflow: hidden; position: relative;">
          <div style="position: absolute; height: 100%; width: 50%; background: linear-gradient(90deg, #FF5B04, #FF7529); border-radius: 999px; animation: progressAnim 1.4s ease-in-out infinite;"></div>
        </div>

        <style>
          @keyframes logoFloat {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-4px) scale(1.02); }
          }
          @keyframes progressAnim {
            0% { left: -50%; width: 40%; }
            50% { left: 25%; width: 60%; }
            100% { left: 100%; width: 40%; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
