<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <rect x="4" y="4" width="184" height="184" rx="38" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Dumbbell / Activity Icon -->
  <g filter="url(#glow)" transform="translate(48, 48)">
    <rect x="18" y="42" width="60" height="12" rx="6" fill="#f8fafc"/>
    <rect x="8" y="24" width="16" height="48" rx="8" fill="url(#accent)"/>
    <rect x="0" y="32" width="10" height="32" rx="5" fill="url(#accent)"/>
    <rect x="72" y="24" width="16" height="48" rx="8" fill="url(#accent)"/>
    <rect x="86" y="32" width="10" height="32" rx="5" fill="url(#accent)"/>
    
    <!-- Pulse Line -->
    <path d="M 12 76 L 36 76 L 44 62 L 52 88 L 60 76 L 84 76" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
